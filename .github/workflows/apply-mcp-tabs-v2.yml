name: Apply MCP tabs v2
on:
  push:
    branches: [main]
    paths:
      - tools/apply_mcp_tabs_v2.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply MCP tab layout
        run: python tools/apply_mcp_tabs_v2.py
      - name: Commit site update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html apps/web/index.html
          if git diff --cached --quiet; then
            echo 'No site changes.'
          else
            git commit -m 'Show one tab per MCP'
            git push
          fi
