name: Apply separate MCP tabs
on:
  push:
    branches: [main]
    paths: [tools/add_server_tabs.py]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/add_server_tabs.py
      - name: Commit site update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html apps/web/index.html
          git commit -m 'Split Chrome and screen-control setup into tabs' || exit 0
          git push
