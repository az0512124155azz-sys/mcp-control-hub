<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box} body{margin:0;background:transparent}.card{border:1px solid rgba(127,127,127,.25);border-radius:18px;padding:18px;background:rgba(255,255,255,.03)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:18px}.status{font-size:12px;padding:6px 9px;border-radius:999px;background:rgba(127,127,127,.12)}
    .tabs{display:flex;gap:8px;margin-top:16px}.tab{border:1px solid rgba(127,127,127,.22);background:transparent;border-radius:10px;padding:9px 12px;font-weight:700}.tab.active{background:rgba(70,110,255,.12);border-color:rgba(70,110,255,.4)}
    .panel{margin-top:14px;padding:14px;border-radius:14px;background:rgba(127,127,127,.07)} h3{margin:0 0 6px;font-size:15px} p{margin:0;color:rgba(127,127,127,.95);line-height:1.5;font-size:13px}.small{margin-top:12px;font-size:12px;color:rgba(127,127,127,.9)}
  </style>
</head>
<body>
  <div class="card">
    <div class="top"><div class="brand">MCP Control Hub</div><div class="status" id="status">Waiting for pairing</div></div>
    <div class="tabs"><button class="tab active" data-mode="chrome">Chrome Control</button><button class="tab" data-mode="computer">Computer Control</button></div>
    <div class="panel" id="panel"></div>
    <div class="small">The plugin uses a local Companion on your computer. The AI only gets access to the mode and tools you explicitly pair.</div>
  </div>
<script>
(() => {
  let mode = 'chrome';
  let last = null;
  const status = document.getElementById('status');
  const panel = document.getElementById('panel');
  const render = () => {
    const paired = !!last?.structuredContent?.paired;
    const online = last?.structuredContent?.online;
    status.textContent = paired ? (online === false ? 'Paired · offline' : 'Paired · ready') : 'Waiting for pairing';
    panel.innerHTML = mode === 'chrome'
      ? '<h3>Chrome Control</h3><p>Open Chrome, navigate, click, type, and take fresh screenshots so the AI can work with the browser.</p>'
      : '<h3>Computer Control</h3><p>See the desktop, move the mouse, click, and type inside local apps such as Blender, Fusion 360, or an IDE.</p>';
  };
  addEventListener('message', (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== '2.0') return;
    if (message.method === 'ui/notifications/tool-result') {
      last = message.params || null;
      render();
    }
  });
  document.querySelectorAll('.tab').forEach((button) => button.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b === button));
    mode = button.dataset.mode;
    render();
  }));
  render();
})();
</script>
</body>
</html>
