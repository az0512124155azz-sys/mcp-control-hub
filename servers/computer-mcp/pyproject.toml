[project]
name = "mcp-control-hub-computer"
version = "1.0.0"
description = "Local MCP server that gives an AI controlled mouse, keyboard and screenshot tools."
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=2.0.0,<3",
  "pyautogui>=0.9.54,<1",
  "pillow>=10,<13",
  "pyperclip>=1.9,<2"
]

[project.scripts]
mcp-computer-control = "server:main"
